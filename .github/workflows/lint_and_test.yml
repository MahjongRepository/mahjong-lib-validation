name: Linters and tests

on:
  push:
    branches:
      - main
    paths:
      - '**/*.py'
      - packages/**/pyproject.toml
      - .pre-commit-config.yaml
      - pyproject.toml
      - uv.lock
      - .github/workflows/lint_and_test.yml
  pull_request:
    branches:
      - main
    paths:
      - '**/*.py'
      - packages/**/pyproject.toml
      - .pre-commit-config.yaml
      - pyproject.toml
      - uv.lock
      - .github/workflows/lint_and_test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.15"

      - name: Install libs
        run: uv sync --locked --no-default-groups --group hooks --no-install-project

      - name: Run pre-commit hooks
        run: uv run --no-sync prek run --all-files

  tests:
    needs: [lint]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.15"
          - "3.15t"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install libs
        run: uv sync --locked --no-default-groups --group test

      - name: Test with python ${{ matrix.python-version }}
        run: uv run --no-sync pytest
