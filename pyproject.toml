[tool.uv.workspace]
members = [
    "packages/corpus",
    "packages/tenhou-converter",
    "packages/majsoul-converter",
    "packages/validator",
]

[tool.uv.sources]
mahjong-corpus = { workspace = true }

[dependency-groups]
dev = [
    { include-group = "hooks" },
]
hooks = [
    "prek>=0.5.11,<0.6",
    { include-group = "lint" },
    { include-group = "typing" },
]
lint = [
    "ruff>=0.17.6,<0.18",
]
typing = [
    "ty>=0.0.108",
    "types-protobuf>=7.35.1.20261122",
    { include-group = "test" },  # ty checks package tests too.
]
test = [
    "pytest>=9.2.0,<10",
]

[tool.ruff]
target-version = "py315"
line-length = 79
extend-exclude = ["references", "packages/majsoul-converter/src/majsoul_converter/liqi"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # pydocstyle
    "COM812",  # missing-trailing-comma
    "ANN002",  # missing-type-args
    "ANN003",  # missing-type-kwargs
    "CPY001",  # missing-copyright-notice
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72
ignore-overlong-task-comments = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.extend-per-file-ignores]
"**/tests/**" = [
    "D",       # pydocstyle
    "S101",    # assert
    "PLR2004", # magic-value-comparison
]

[tool.ty.src]
include = ["packages"]
exclude = ["packages/majsoul-converter/src/majsoul_converter/liqi"]

[tool.ty.environment]
python-version = "3.15"

[tool.pytest]
testpaths = ["packages"]
addopts = ["--import-mode=importlib"]
consider_namespace_packages = true
