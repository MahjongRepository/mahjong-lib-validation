[project]
name = "mahjong-lib-validation"
version = "0.0.1"
description = "Validation and benchmarking tools for the mahjong library."
authors = [
    { name = "Alexey Lisikhin", email = "alexey@nihisil.com" },
    { name = "Apricot S." },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Private :: Do Not Upload",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Games/Entertainment :: Board Games",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/MahjongRepository/mahjong-lib-validation"

[dependency-groups]
dev = [
    { include-group = "hooks" },
    { include-group = "test" },
]
hooks = [
    "prek>=0.5.9,<0.6",
    { include-group = "lint" },
    { include-group = "typing" },
]
lint = [
    "ruff>=0.17.3,<0.18",
]
typing = [
    "ty>=0.0.95",
]
test = [
    "pytest>=9.2.0,<10",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/corpus",
    "packages/tenhou-converter",
    "packages/validator",
]

[tool.ruff]
line-length = 79
extend-exclude = ["references"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # pydocstyle
    "COM812",  # missing-trailing-comma
    "ANN002",  # missing-type-args
    "ANN003",  # missing-type-kwargs
    "CPY001",  # missing-copyright-notice
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72
ignore-overlong-task-comments = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.extend-per-file-ignores]
"**/tests/**" = [
    "D",       # pydocstyle
    "S101",    # assert
    "PLR2004", # magic-value-comparison
]

[tool.ty.src]
include = ["packages"]

[tool.ty.environment]
python-version = "3.15"

[tool.pytest]
testpaths = ["packages"]
addopts = ["--import-mode=importlib"]
