[project]
name = "mahjong-validator"
version = "0.0.1"
description = "Validate the mahjong library against scoring corpora."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.15"
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "corpus==0.1.0",
    "mahjong>=2.1.0,<2.2",
]

[project.scripts]
mahjong-validator = "validator.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "validator"
