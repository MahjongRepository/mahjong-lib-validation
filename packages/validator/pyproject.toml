[project]
name = "mahjong-validator"
version = "0.0.3"
description = "Validate the mahjong library against scoring corpora."
authors = [
    { name = "Apricot S." },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.15"
classifiers = [
    "Private :: Do Not Upload",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "mahjong-corpus==0.1.0",
    "mahjong>=2.3.0,<2.4",
]

[project.scripts]
mahjong-validator = "validator.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "validator"

# Uncomment one source to test a development version of mahjong.
# The source must satisfy the version range in project.dependencies.
[tool.uv.sources]
# Local edits. The path is relative to this file.
# mahjong = { path = "../../../mahjong", editable = true }
# Reproducible runs. Replace COMMIT_SHA with the full commit hash.
# mahjong = { git = "https://github.com/MahjongRepository/mahjong", rev = "COMMIT_SHA" }
