[project]
name = "tenhou-converter"
version = "0.1.0"
description = "Convert Tenhou mjlog records to validation corpora."
authors = [
    { name = "Apricot S." },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.15"
classifiers = [
    "Private :: Do Not Upload",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "mahjong-corpus>=0.1.0,<0.2",
]

[project.scripts]
tenhou-converter = "tenhou_converter.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
